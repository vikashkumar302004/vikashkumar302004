<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Animated contribution snake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#17103a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="15" height="15" rx="3" fill="#94a3b8" opacity=".16"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="route" d="M55 56 H825 Q850 56 850 78 Q850 100 825 100 H75 Q50 100 50 122 Q50 144 75 144 H825"/>
  </defs>
  <rect width="900" height="190" rx="18" fill="url(#bg)"/>
  <rect x="38" y="39" width="824" height="122" rx="12" fill="url(#grid)"/>
  <path d="M55 56 H825 Q850 56 850 78 Q850 100 825 100 H75 Q50 100 50 122 Q50 144 75 144 H825" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity=".16"/>
  <g filter="url(#glow)">
    <circle r="9" fill="#ec4899">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="8" fill="#a855f7" opacity=".9">
      <animateMotion dur="8s" begin="-.11s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="7" fill="#6366f1" opacity=".82">
      <animateMotion dur="8s" begin="-.22s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="6" fill="#22d3ee" opacity=".72">
      <animateMotion dur="8s" begin="-.33s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
    </circle>
  </g>
  <circle r="3" fill="#fff">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
  </circle>
  <text x="450" y="181" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.5" fill="#94a3b8">CODE • CREATE • ITERATE</text>
</svg>
