<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Vikash Kumar — Backend and GenAI Engineer</title>
  <desc id="desc">Animated dark gradient developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset=".52" stop-color="#11102b"/>
      <stop offset="1" stop-color="#071a26"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c4b5fd" opacity=".13"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#dots)"/>
  <circle cx="260" cy="70" r="240" fill="url(#glowA)" filter="url(#soft)">
    <animate attributeName="cx" values="260;350;260" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="350" r="260" fill="url(#glowB)" filter="url(#soft)">
    <animate attributeName="cy" values="350;270;350" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect x="42" y="42" width="1116" height="336" rx="22" fill="none" stroke="#a78bfa" stroke-opacity=".18"/>
  <g transform="translate(78 78)">
    <circle cx="0" cy="0" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <text x="17" y="5" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing="2">AVAILABLE TO BUILD</text>
  </g>
  <text x="600" y="183" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="750" letter-spacing="-2">VIKASH KUMAR</text>
  <rect x="348" y="210" width="504" height="2" rx="1" fill="url(#line)"/>
  <text x="600" y="263" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="25" font-weight="600" letter-spacing="4">BACKEND  ×  GENAI ENGINEER</text>
  <text x="600" y="312" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing=".5">Reliable systems. Intelligent products. Thoughtful execution.</text>
  <g transform="translate(1082 78)" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".8">
    <path d="M-18 0h36M0-18v36"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></path>
    <circle r="28" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/></circle>
  </g>
</svg>
