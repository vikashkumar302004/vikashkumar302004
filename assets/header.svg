<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Vikash Kumar</title>
  <desc id="desc">Backend and GenAI Engineer</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b17"/>
      <stop offset=".5" stop-color="#17143b"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6366f1" stop-opacity=".32"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c4b5fd" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="230" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="230" rx="18" fill="url(#dots)"/>
  <circle cx="220" cy="50" r="230" fill="url(#glow)">
    <animate attributeName="cx" values="220;330;220" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="190" r="180" fill="url(#glow)" opacity=".55">
    <animate attributeName="cy" values="190;130;190" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="28" y="28" width="1144" height="174" rx="14" fill="none" stroke="#a78bfa" stroke-opacity=".18"/>
  <g transform="translate(68 63)">
    <circle r="5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="16" y="5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2" fill="#94a3b8">BUILDING IN PUBLIC</text>
  </g>
  <text x="600" y="112" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="750" letter-spacing="-1" fill="#f8fafc">VIKASH KUMAR</text>
  <rect x="430" y="130" width="340" height="2" rx="1" fill="url(#accent)"/>
  <text x="600" y="165" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="600" letter-spacing="3" fill="#c4b5fd">BACKEND × GENAI ENGINEER</text>
  <g transform="translate(1122 60)" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".75">
    <circle r="18" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#22d3ee" stroke="none"/>
  </g>
</svg>
