<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Animated coding trail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d1117"/><stop offset=".5" stop-color="#15112d"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="trail"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <pattern id="cells" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="13" height="13" rx="3" fill="#64748b" opacity=".18"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="route" d="M45 45H955Q975 45 975 65T955 85H45Q25 85 25 105T45 125H955"/>
  </defs>
  <rect width="1000" height="170" rx="18" fill="url(#bg)"/>
  <rect x="20" y="25" width="960" height="120" rx="12" fill="url(#cells)"/>
  <path d="M45 45H955Q975 45 975 65T955 85H45Q25 85 25 105T45 125H955" fill="none" stroke="url(#trail)" stroke-width="3" opacity=".14"/>
  <g filter="url(#glow)">
    <circle r="9" fill="#ec4899"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="8" fill="#a855f7"><animateMotion dur="9s" begin="-.12s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="7" fill="#6366f1"><animateMotion dur="9s" begin="-.24s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
    <circle r="6" fill="#22d3ee"><animateMotion dur="9s" begin="-.36s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  </g>
  <text x="500" y="159" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="3" fill="#64748b">ONE COMMIT AT A TIME</text>
</svg>
